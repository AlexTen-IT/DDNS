name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: Analisis SAST con Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Ejecutar Semgrep y generar reporte
        run: >
          semgrep scan
          --config p/ci
          --error
          --sarif
          --output semgrep.sarif
          .

      - name: Guardar reporte Semgrep
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-semgrep
          path: semgrep.sarif

      - name: Subir reporte Semgrep a Security
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependency-scan:
    name: Escaneo de dependencias con Trivy
    runs-on: ubuntu-latest
    outputs:
      critical_count: ${{ steps.evaluate.outputs.critical_count }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar Trivy y generar reporte
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Contar vulnerabilidades criticas
        id: evaluate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(
              fs.readFileSync('trivy-results.json', 'utf8')
            );

            const vulnerabilities = (report.Results || [])
              .flatMap(result => result.Vulnerabilities || []);

            const critical = vulnerabilities.filter(
              vulnerability => vulnerability.Severity === 'CRITICAL'
            );

            core.setOutput('critical_count', String(critical.length));

            await core.summary
              .addHeading('Resultado de Trivy')
              .addRaw(`Vulnerabilidades criticas: ${critical.length}`, true)
              .write();

            for (const vulnerability of critical) {
              core.warning(
                `${vulnerability.VulnerabilityID}: ` +
                `${vulnerability.PkgName} ` +
                `${vulnerability.InstalledVersion}`
              );
            }

      - name: Guardar reporte Trivy
        if: ${{ always() && hashFiles('trivy-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-trivy
          path: trivy-results.json

      - name: Bloquear si hay vulnerabilidades criticas
        if: ${{ steps.evaluate.outputs.critical_count != '0' }}
        run: |
          echo "Se han detectado vulnerabilidades criticas."
          echo "Despliegue bloqueado. Revisar el reporte de Trivy."
          exit 1

  create-security-ticket:
    name: Crear ticket de vulnerabilidad critica
    needs: [dependency-scan]
    if: >-
      ${{
        always() &&
        needs.dependency-scan.outputs.critical_count != '' &&
        needs.dependency-scan.outputs.critical_count != '0' &&
        github.event_name == 'push'
      }}
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Crear o actualizar incidencia
        uses: actions/github-script@v7
        env:
          CRITICAL_COUNT: ${{ needs.dependency-scan.outputs.critical_count }}
        with:
          script: |
            const title = 'Vulnerabilidades criticas detectadas por Trivy';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `Trivy ha detectado ${process.env.CRITICAL_COUNT} hallazgos criticos.`,
              '',
              'El despliegue simulado esta bloqueado.',
              `Ejecucion e informes: ${runUrl}`,
              '',
              'Revisar el artefacto reporte-trivy, corregir las dependencias',
              'y comprobar una nueva ejecucion antes de cerrar este ticket.'
            ].join('\n');

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                ...context.repo,
                state: 'open',
                per_page: 100
              }
            );

            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title
            );

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body
              });
            }

  deploy:
    name: Despliegue seguro simulado
    needs: [sast, dependency-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Autorizar despliegue
        run: |
          echo "Analisis de seguridad superado."
          echo "Despliegue simulado autorizado."